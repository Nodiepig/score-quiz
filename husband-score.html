<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>婚姻幸福指數測驗：妳老公到底幾分？</title>
<style>
:root{--bg:#e0c8bb;--card:#ecdcd3;--ink:#1f1a18;--sub:#5c4a44;--rose:#b95c88;--gold:#e5cfae;--line:#c9ad9f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1918;--card:#2b2625;--ink:#f3e9e3;--sub:#b9aaa2;--rose:#d9779f;--gold:#e5cfae;--line:#443c3a}}
:root[data-theme="dark"]{--bg:#1c1918;--card:#2b2625;--ink:#f3e9e3;--sub:#b9aaa2;--rose:#d9779f;--gold:#e5cfae;--line:#443c3a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC",serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub)}
.bar{height:5px;background:var(--line);border-radius:3px;margin:12px 0 28px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);width:0;transition:width .3s}
h1{font-size:34px;line-height:1.3;margin:40px 0 12px}
h1 b{color:var(--rose)}
h2{font-size:22px;line-height:1.4;margin:0 0 6px}
h2 small{color:var(--rose);font-style:italic;font-weight:400;font-size:15px;margin:0 4px}
.qn{color:var(--rose);font-size:15px;margin-bottom:4px}
p{line-height:1.8;color:var(--sub);margin:8px 0}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:14px;margin-top:12px;font:inherit;font-size:16px;line-height:1.6;cursor:pointer}
.opt:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.opt.on{border-color:var(--rose)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:italic}
.opt .t{flex:1}
.opt .s{flex:none;font-weight:700;font-size:14px;padding:5px 11px;border-radius:99px;border:1.5px solid var(--sub);color:var(--sub)}
.opt .s.g{background:var(--rose);border-color:var(--rose);color:#fff}
.nav{display:flex;justify-content:space-between;margin-top:24px;gap:10px}
.btn{font:inherit;font-size:16px;padding:11px 22px;border-radius:99px;border:2px solid var(--rose);background:var(--rose);color:#fff;cursor:pointer}
.btn.ghost{background:none;color:var(--rose)}
.btn:disabled{opacity:.35;cursor:default}
.big{font-size:84px;line-height:1;color:var(--rose);margin:10px 0 0}
.big small{font-size:22px;color:var(--sub)}
.tier{background:var(--card);border-radius:14px;padding:14px 16px;margin-top:12px;border:2px solid transparent}
.tier.me{border-color:var(--rose)}
.tier h3{margin:0;font-size:18px}.tier h3 span{color:var(--rose);font-style:italic;font-size:15px;margin-right:6px}
.tier p{margin:4px 0 0;font-size:15px}
.note{margin-top:26px;font-size:14px}
.src{margin-top:28px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// [左標題, 右標題, A選項, B選項, 得分選項(0=A,1=B)]
var Q=[
["功能型老公","只出一張嘴","事情交代了會去做","很會答應，最後還是妳做",0],
["大男人","家庭隊友","「家事本來就是女人做的」","家事、小孩願意一起分擔",1],
["不會講情話","只會說不會做","嘴巴笨，但事情都有做到","很會說「老婆辛苦了」，實際什麼都沒做",0],
["回家躺平","回家接手","回家就是沙發、手機、電視","看到妳忙會主動接手",1],
["要老婆提醒","自己會做","什麼都要妳交代","自己知道家裡有哪些事情要處理",1],
["小孩是老婆的","小孩也是他的","「妳比較會帶」","餵飯、洗澡、接送、陪玩都會做",1],
["不會安慰","笨拙但願意陪","妳哭只會說「又怎麼了？」","不太會講，但會陪著妳",1],
["老婆累了還繼續叫","主動接手","「晚餐好了沒？」","「妳去休息，我來。」",1],
["老婆是理所當然","看見老婆的付出","覺得妳做什麼都是應該的","會說「謝謝、辛苦了」",1],
["自己的爸媽優先","老婆優先","遇到事情第一時間先顧爸媽感受","會先跟老婆討論，再一起處理",1],
["公婆問題老婆自己扛","老公出面","「妳跟我媽自己講」","涉及自己爸媽時，願意出面溝通",1],
["婆媳衝突叫老婆忍","保護婚姻界線","「都是一家人，妳忍一下」","會先了解事情，再處理雙方關係",1],
["姑嫂問題不關我的事","願意協調","「那是妳跟我姊妹的事情」","必要時會協調，不讓老婆一個人承受",1],
["原生家庭優先","小家庭優先","凡事先滿足原生家庭","婚後把自己的小家庭放在重要位置",1],
["老婆","朋友","朋友一約就走，老婆的事情往後排","會先安排好家庭，再跟朋友約",1],
["兄弟姊妹","老婆","兄弟姊妹一有事情就第一時間衝過去","會先顧好自己的家庭，再去幫忙",1],
["老婆需要時缺席","有事一定在","朋友、家人有事都比老婆優先","老婆真的需要他的時候，他會出現",1],
["吵架冷戰","願意解決問題","一吵架就消失、冷戰、拒絕溝通","冷靜後願意把問題講開",1],
["遇到問題先怪老婆","一起解決","「都是妳弄的」","「現在我們要怎麼處理？」",1],
["錢各管各的","家庭財務一起討論","重要財務完全不讓妳知道","重要支出願意一起討論",1],
["只顧自己","會想到全家","吃什麼、買什麼都先想到自己","做決定會考慮全家",1],
["家裡壞了等老婆","自己處理","「找人修就好了」","會先自己研究、處理",1],
["育兒觀眾","育兒隊友","只陪孩子玩，不管照顧工作","願意一起承擔育兒責任",1],
["只看到妳沒做的","看見妳做的","「飯怎麼還沒煮？」","「妳今天是不是很累？」",1],
["老婆說了才聽","主動關心","妳不說，他完全不管","會主動問妳今天過得怎麼樣",1],
["老婆是超人","知道老婆也會累","覺得妳什麼都可以自己來","看到妳撐不住會主動幫忙",1],
["只當好爸爸","也是好隊友","只陪孩子玩，家事育兒都不管","願意承擔實際照顧工作",1],
["外人面前不顧老婆","尊重老婆","為了給別人面子，讓老婆難堪","即使不同意，也不會故意讓老婆難堪",1],
["只會要求","願意分擔","「家裡怎麼那麼亂？」","「哪裡需要我幫忙？」",1],
["朋友第一名","家庭也重要","朋友約就算有家庭安排也想去","會把家庭行程當一回事",1],
["紀念日都忘記","重要日子記得","生日、紀念日常常忘記","至少重要日子會記得",1],
["只會賺錢","願意一起經營家庭","「我賺錢了，其他都是妳的事」","即使工作忙，也願意參與家庭",1],
["妳的事情","兩個人的事情","「那是妳自己的事」","會把重要事情當成兩個人的事情",1],
["生活室友","人生隊友","各忙各的，有事情再說","遇到大事會一起討論、一起扛",1],
["老婆的感受","老婆的感受也重要","「妳想太多了」","即使不完全理解，也願意尊重妳的感受",1]
];
var T=[[90,100,"神隊友型","妳們的婚姻裡，伴侶合作感、家庭責任感相對高。"],
[75,89,"可靠隊友型","不一定浪漫，但大部分重要事情有人一起扛。"],
[60,74,"嘴巴欠但其實還行型","可能不太會給情緒價值，但生活中還是有不少可以依靠的地方。"],
[40,59,"老婆辛苦型","很多事情都需要妳主動提醒、安排、溝通。"],
[0,39,"老婆超載型","該重新看看：家庭分工、夫妻界線、原生家庭界線，以及彼此的期待。"]];
function pts(i){return i>=9&&i<=18?5:2}
var ans=new Array(Q.length).fill(null),cur=-1,app=document.getElementById("app");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function head(){var p=cur<0?0:Math.min(cur+1,Q.length)/Q.length*100;
return '<div class="top"><span>婚姻幸福指數測驗</span><span>'+(cur>=0&&cur<Q.length?(cur+1)+' / '+Q.length:'')+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div>'}
function start(){cur=-1;ans.fill(null);
app.innerHTML=head()+'<h1>妳老公到底<b>幾分</b>？</h1><p><b>35 題，滿分 100 分。</b></p><p>每題選一個最像他的，不用想太久，憑真實感受就好。一般題 25 題 × 2 分 = 50 分，核心題 10 題 × 5 分 = 50 分。先別急著嫌他，滑完再說。</p><div class="nav"><span></span><button class="btn" id="go">開始作答</button></div><div class="src">題目出處：Instagram @nat_3ody</div>';
document.getElementById("go").onclick=function(){cur=0;show()}}
function show(){var q=Q[cur],p=pts(cur),o=[2,3].map(function(k,i){var g=q[4]===i;
return '<button class="opt'+(ans[cur]===i?' on':'')+'" data-i="'+i+'"><span class="l">'+"AB"[i]+'</span><span class="t">'+esc(q[k])+'</span><span class="s'+(g?' g':'')+'">+'+(g?p:0)+'分</span></button>'}).join("");
app.innerHTML=head()+'<div class="qn">'+(p==5?'核心題　每題 5 分':'一般題　每題 2 分')+'</div><h2>'+q[0]+'<small>vs</small>'+q[1]+'</h2>'+o+'<div class="nav"><button class="btn ghost" id="bk">上一題</button><button class="btn" id="nx" '+(ans[cur]===null?'disabled':'')+'>'+(cur==Q.length-1?'看結果':'下一題')+'</button></div>';
[].forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){ans[cur]=+b.dataset.i;show();setTimeout(next,250)}});
document.getElementById("bk").onclick=function(){if(cur==0)start();else{cur--;show()}};
document.getElementById("nx").onclick=next}
function next(){if(ans[cur]===null)return;if(cur<Q.length-1){cur++;show();window.scrollTo(0,0)}else result()}
function score(){return ans.reduce(function(s,a,i){return s+(a!==null&&a===Q[i][4]?pts(i):0)},0)}
function result(){cur=Q.length;var s=score(),me=T.filter(function(t){return s>=t[0]&&s<=t[1]})[0];
app.innerHTML=head()+'<div class="qn">妳家那位的分數</div><div class="big">'+s+'<small> / 100</small></div><div class="tier me"><h3>'+me[2]+'</h3><p>'+me[3]+'</p></div><h2 style="margin-top:28px;font-size:18px">所有結果</h2>'+
T.map(function(t){return '<div class="tier'+(t===me?' me':'')+'"><h3><span>'+t[0]+'–'+t[1]+'分</span>'+t[2]+'</h3><p>'+t[3]+'</p></div>'}).join("")+
'<p class="note"><b>不要急著嫌他。</b>有時候跟姐妹聊完別人的老公，妳會突然發現：「欸……我老公除了不會給情緒價值，好像真的沒有什麼好挑的。」有事情的時候，他會跟妳站在一起。</p><p class="note">本測驗僅供娛樂與姐妹聊天參考。</p><div class="nav"><button class="btn ghost" id="bk">改上一題</button><button class="btn" id="rs">重新測驗</button></div>';
document.getElementById("bk").onclick=function(){cur=Q.length-1;show()};document.getElementById("rs").onclick=start;window.scrollTo(0,0)}
start();
</script>
</body>
</html>
